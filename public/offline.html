<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>حالت آفلاین | بشنو بخوان</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f8f5ec; background: #0f172a; font-family: Tahoma, sans-serif; text-align: center; }
    main { max-width: 420px; padding: 32px 24px; border: 1px solid rgba(212,175,55,.35); border-radius: 24px; background: rgba(248,245,236,.04); }
    h1 { margin: 0 0 12px; color: #e3c75a; font-size: 1.5rem; }
    p { color: rgba(248,245,236,.75); line-height: 2; }
    a { display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 999px; color: #0f172a; background: #d4af37; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>در حال حاضر آفلاین هستی</h1>
    <p>برای دریافت شعرها و خوانش‌های تازه دوباره به اینترنت وصل شو. اگر برنامه قبلاً بارگذاری شده باشد، پوسته آن از حافظه دستگاه باز می‌شود.</p>
    <a href="./">تلاش دوباره</a>
  </main>
</body>
</html>
