name: Verify and Deploy Molavi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molavi-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm run test:ci -- --no-progress

  build:
    name: Production build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned icon renderer and native back-button bridge
        run: npm install --no-save --no-package-lock sharp@0.34.3

      - name: Generate branded web/PWA icons
        run: node scripts/generate-brand-assets.mjs

      - name: Build for GitHub Pages
        run: npm run build -- --configuration=production --base-href=/molavi-poetry-app/

      - name: Verify brand assets
        run: |
          test -s dist/molavi-poetry-app/browser/icons/beshno-bekhan-192.png
          test -s dist/molavi-poetry-app/browser/icons/beshno-bekhan-512.png
          grep -q 'بشنو بخوان' dist/molavi-poetry-app/browser/manifest.webmanifest

      - name: Add SPA fallback
        run: cp dist/molavi-poetry-app/browser/index.html dist/molavi-poetry-app/browser/404.html

      - name: Disable Jekyll processing
        run: touch dist/molavi-poetry-app/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/molavi-poetry-app/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
