name: Verify and Deploy Molavi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: molavi-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update patched Angular and Capacitor runtime dependencies
        run: |
          npm install --save-exact --no-audit --no-fund @angular/common@20.3.35 @angular/compiler@20.3.35 @angular/core@20.3.35 @angular/forms@20.3.35 @angular/platform-browser@20.3.35 @angular/router@20.3.35 @capacitor/core@8.0.0 @capacitor/app@8.0.0
          npm install --save-dev --save-exact --no-audit --no-fund @angular/build@20.3.35 @angular/cli@20.3.35 @angular/compiler-cli@20.3.35

      - name: Persist patched dependency lockfile on the pull request branch
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(security): patch Angular and add Capacitor App bridge"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
          fi

      - name: Persist patched lockfile on the pull request branch
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(security): update patched Angular runtime dependencies"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
          fi

      - name: Run dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm run test:ci -- --no-progress

  build:
    name: Production build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install patched Angular and Capacitor runtime dependencies
        run: |
          npm install --save-exact --no-audit --no-fund @angular/common@20.3.35 @angular/compiler@20.3.35 @angular/core@20.3.35 @angular/forms@20.3.35 @angular/platform-browser@20.3.35 @angular/router@20.3.35 @capacitor/core@8.0.0 @capacitor/app@8.0.0
          npm install --save-dev --save-exact --no-audit --no-fund @angular/build@20.3.35 @angular/cli@20.3.35 @angular/compiler-cli@20.3.35

      - name: Install pinned icon renderer and native back-button bridge
        run: npm install --no-save --no-package-lock sharp@0.34.3

      - name: Generate branded web/PWA icons
        run: node scripts/generate-brand-assets.mjs

      - name: Build for GitHub Pages
        run: npm run build -- --configuration=production --base-href=/molavi-poetry-app/

      - name: Verify brand assets
        run: |
          test -s dist/molavi-poetry-app/browser/icons/beshno-bekhan-192.png
          test -s dist/molavi-poetry-app/browser/icons/beshno-bekhan-512.png
          grep -q 'بشنو بخوان' dist/molavi-poetry-app/browser/manifest.webmanifest

      - name: Add SPA fallback
        run: cp dist/molavi-poetry-app/browser/index.html dist/molavi-poetry-app/browser/404.html

      - name: Disable Jekyll processing
        run: touch dist/molavi-poetry-app/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/molavi-poetry-app/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
