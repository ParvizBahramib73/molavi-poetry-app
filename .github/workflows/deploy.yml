name: Verify and Deploy Molavi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molavi-pages
  cancel-in-progress: false

jobs:
  prepare-release-lock:
    if: github.head_ref == 'release/bazaar-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    name: Resolve patched dependencies and verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout trusted release branch without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve exact direct dependency pins into the lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --no-progress

      - name: Apply non-breaking transitive advisory fixes
        shell: bash
        run: |
          mkdir -p release-evidence
          set +e
          npm audit fix --package-lock-only --no-fund --no-progress > release-evidence/npm-audit-fix.log 2>&1
          echo "$?" > release-evidence/npm-audit-fix.exit-code
          set -e

      - name: Install exactly from the generated lockfile
        run: npm ci

      - name: Generate dependency audit evidence
        shell: bash
        run: |
          set +e
          npm audit --json > release-evidence/web-all.json 2> release-evidence/web-all.stderr
          echo "$?" > release-evidence/web-all.exit-code
          npm audit --omit=dev --json > release-evidence/web-runtime.json 2> release-evidence/web-runtime.stderr
          echo "$?" > release-evidence/web-runtime.exit-code
          set -e

      - name: Verify all unit tests
        run: npm run test:ci -- --no-progress

      - name: Generate web and Android brand assets
        run: node scripts/generate-brand-assets.mjs

      - name: Build production web output
        run: npm run build -- --configuration=production --base-href=/molavi-poetry-app/

      - name: Verify web release output
        run: |
          test -s dist/molavi-poetry-app/browser/index.html
          test -s dist/molavi-poetry-app/browser/icons/beshno-bekhan-192.png
          test -s dist/molavi-poetry-app/browser/icons/beshno-bekhan-512.png
          grep -q 'بشنو بخوان' dist/molavi-poetry-app/browser/manifest.webmanifest

      - name: Commit generated lockfile to the release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -c core.hooksPath=/dev/null add package-lock.json
            git -c core.hooksPath=/dev/null commit -m "chore(deps): lock patched release dependency graph"
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/release/bazaar-hardening
          else
            echo "package-lock.json is already synchronized."
          fi

      - name: Upload dependency and web build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beshno-Bekhan-Release-Dependency-Evidence
          path: |
            release-evidence/
            dist/molavi-poetry-app/browser/
          if-no-files-found: warn
          retention-days: 30

  verify:    if: github.head_ref != 'release/bazaar-hardening'
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm run test:ci -- --no-progress

  build:
    name: Production build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate branded web/PWA icons
        run: node scripts/generate-brand-assets.mjs

      - name: Build for GitHub Pages
        run: npm run build -- --configuration=production --base-href=/molavi-poetry-app/

      - name: Verify brand assets
        run: |
          test -s dist/molavi-poetry-app/browser/icons/beshno-bekhan-192.png
          test -s dist/molavi-poetry-app/browser/icons/beshno-bekhan-512.png
          grep -q 'بشنو بخوان' dist/molavi-poetry-app/browser/manifest.webmanifest

      - name: Add SPA fallback
        run: cp dist/molavi-poetry-app/browser/index.html dist/molavi-poetry-app/browser/404.html

      - name: Disable Jekyll processing
        run: touch dist/molavi-poetry-app/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/molavi-poetry-app/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
