name: Prepare release dependency lockfile

on:
  push:
    branches: [release/bazaar-hardening]

permissions:
  contents: read

concurrency:
  group: release-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-and-verify:
    name: Resolve patched dependencies and verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/bazaar-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve exact direct dependency pins into the lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply non-breaking transitive advisory fixes
        shell: bash
        run: |
          mkdir -p release-evidence
          set +e
          npm audit fix --package-lock-only --no-fund --no-progress > release-evidence/npm-audit-fix.log 2>&1
          echo "$?" > release-evidence/npm-audit-fix.exit-code
          set -e

      - name: Install exactly from the generated lockfile
        run: npm ci

      - name: Generate dependency audit evidence
        shell: bash
        run: |
          set +e
          npm audit --json > release-evidence/web-all.json 2> release-evidence/web-all.stderr
          echo "$?" > release-evidence/web-all.exit-code
          npm audit --omit=dev --json > release-evidence/web-runtime.json 2> release-evidence/web-runtime.stderr
          echo "$?" > release-evidence/web-runtime.exit-code
          set -e

      - name: Verify all unit tests
        run: npm run test:ci -- --no-progress

      - name: Generate web and Android brand assets
        run: node scripts/generate-brand-assets.mjs

      - name: Build production web output
        run: npm run build -- --configuration=production --base-href=/molavi-poetry-app/

      - name: Verify web release output
        run: |
          test -s dist/molavi-poetry-app/browser/index.html
          test -s dist/molavi-poetry-app/browser/icons/beshno-bekhan-192.png
          test -s dist/molavi-poetry-app/browser/icons/beshno-bekhan-512.png
          grep -q 'بشنو بخوان' dist/molavi-poetry-app/browser/manifest.webmanifest

      - name: Commit generated lockfile to the release branch
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): lock patched release dependency graph"
            git push origin HEAD:refs/heads/release/bazaar-hardening
          else
            echo "package-lock.json is already synchronized."
          fi

      - name: Upload dependency and web build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beshno-Bekhan-Release-Dependency-Evidence
          path: |
            release-evidence/
            dist/molavi-poetry-app/browser/
          if-no-files-found: warn
          retention-days: 30
